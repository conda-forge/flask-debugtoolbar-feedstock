schema_version: 1

context:
  name: flask-debugtoolbar
  version: "0.16.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 3b925d4dcc09205471e5021019dfeb0eb6dabd6c184de16a3496dfb1f342afe1

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}
    - setuptools >=42
    - wheel
    - pip
    - flit-core
  run:
    - python >=${{ python_min }}
    - flask >=2.3.0
    - blinker
    - packaging
    - itsdangerous
    - werkzeug
    - markupsafe

tests:
  - python:
      imports:
        - flask_debugtoolbar
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A toolbar overlay for debugging Flask applications.
  homepage: http://flask-debugtoolbar.rtfd.org/
  repository: https://github.com/mgood/flask-debugtoolbar
  documentation: http://flask-debugtoolbar.rtfd.org/

extra:
  recipe-maintainers:
    - pmlandwehr
    - jan-janssen
